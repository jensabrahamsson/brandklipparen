  <rect x="150" y="300" width="1170" height="120" fill="#E5534B" fill-opacity="0.05"/>
  <rect x="150" y="420" width="1170" height="90" fill="#E5A13A" fill-opacity="0.05"/>
  <rect x="150" y="510" width="1170" height="90" fill="#3FB97F" fill-opacity="0.05"/>
  <line x1="150" y1="420" x2="1320" y2="420" stroke="#E5534B" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="150" y1="510" x2="1320" y2="510" stroke="#E5A13A" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="150" y1="600" x2="1320" y2="600" stroke="#262D38"/>
  <text x="138" y="304" class="ax" text-anchor="end">100</text>
  <text x="138" y="424" class="ax" text-anchor="end">60</text>
  <text x="138" y="514" class="ax" text-anchor="end">30</text>
  <text x="138" y="604" class="ax" text-anchor="end">0</text>
  <text x="1316" y="316" font-size="11" class="hi" text-anchor="end" fill-opacity="0.7">HIGH</text>
  <text x="1316" y="436" font-size="11" class="mid" text-anchor="end" fill-opacity="0.7">ELEVATED</text>
  <text x="1316" y="526" font-size="11" class="lo" text-anchor="end" fill-opacity="0.7">LOW</text>

