  <text x="694" y="37" font-size="12" class="q" text-anchor="end">⌘K</text>
  <text x="1150" y="38" font-size="14" class="s">Just deployed</text>
  <text x="1268" y="38" font-size="14" class="s">API</text>
  <text x="1330" y="38" font-size="14" class="s">Sign in</text>

  <!-- TOKENHUVUD (kompakt) -->
  <circle cx="102" cy="122" r="22" fill="#3B2F4A"/>
  <text x="102" y="127" font-size="13" class="b" text-anchor="middle">GS</text>
  <text x="138" y="120" font-size="28" class="b" letter-spacing="-0.4">Gaslight <tspan class="s" font-size="20" font-weight="400">GSLT</tspan></text>
  <text x="138" y="148" font-size="13" class="m s">0x1234…9a0f</text>
  <text x="240" y="148" font-size="13" class="q">Deployed 2 h ago · block <tspan class="m">21 407 690</tspan></text>
  <rect x="1240" y="104" width="120" height="32" rx="16" fill="#321A1B"/>
  <text x="1300" y="125" font-size="14" class="b hi" text-anchor="middle">84 · High</text>

  <text x="80" y="198" font-size="14" class="s">Overview</text>
  <text x="172" y="198" font-size="14" class="s">Signals <tspan class="q">7</tspan></text>
  <text x="262" y="198" font-size="14" class="b">Timeline</text>
  <rect x="262" y="207" width="60" height="2" fill="#7E9CC2"/>
  <text x="344" y="198" font-size="14" class="s">Bytecode</text>
  <line x1="80" y1="209" x2="1360" y2="209" stroke="#1E242D"/>

  <!-- ========== HUVUDGRAF ========== -->
