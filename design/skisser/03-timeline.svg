  <text x="1240" y="1005" font-size="14" class="b mid" text-anchor="end">+3</text>
  <text x="1336" y="1005" font-size="14" class="b mid" text-anchor="end">44</text>

  <!-- 3, marked with Muse explanation -->
  <rect x="81" y="1028" width="1278" height="96" fill="#E5534B" fill-opacity="0.05"/>
  <rect x="81" y="1028" width="3" height="96" fill="#E5534B"/>
  <line x1="104" y1="1028" x2="1336" y2="1028" stroke="#232A34"/>
  <circle cx="116" cy="1056" r="11" fill="none" stroke="#E5534B" stroke-width="1.5"/>
  <text x="116" y="1060" font-size="11" class="b" text-anchor="middle">3</text>
  <text x="140" y="1061" font-size="12" class="m q">+11 min</text>
  <text x="240" y="1061" font-size="14" class="b">Proxy upgraded to new logic <tspan class="m s" font-weight="400">0x8c0e…4d2b</tspan>. New: <tspan class="m" font-weight="400">blacklist(address)</tspan>, <tspan class="m" font-weight="400">setSellFee(uint256)</tspan></text>
  <rect x="1050" y="1044" width="74" height="22" rx="11" fill="#1E2A3A"/>
  <text x="1087" y="1059" font-size="11" class="br" text-anchor="middle">Bytecode</text>
  <text x="1240" y="1061" font-size="14" class="b hi" text-anchor="end">+34</text>
  <text x="1336" y="1061" font-size="14" class="b hi" text-anchor="end">78</text>
  <circle cx="246" cy="1090" r="6" fill="#7E9CC2" fill-opacity="0.25"/>
  <circle cx="246" cy="1090" r="2.5" fill="#7E9CC2"/>
  <text x="260" y="1094" font-size="13" class="s">The token looked ordinary at deploy, then changed its own rules 11 minutes later.</text>
  <text x="260" y="1112" font-size="13" class="s">Three look-alike contracts did the same before they blocked sells.  <tspan class="q">— Muse</tspan></text>

  <!-- 4 -->
  <line x1="104" y1="1124" x2="1336" y2="1124" stroke="#232A34"/>
  <circle cx="116" cy="1152" r="11" fill="none" stroke="#E5534B" stroke-width="1.5"/>
  <text x="116" y="1156" font-size="11" class="b" text-anchor="middle">4</text>
  <text x="140" y="1157" font-size="12" class="m q">+26 min</text>
  <text x="240" y="1157" font-size="14">Sell fee set to 99% by the owner</text>
  <rect x="1050" y="1140" width="68" height="22" rx="11" fill="#262D38"/>
  <text x="1084" y="1155" font-size="11" class="s" text-anchor="middle">Storage</text>
  <text x="1240" y="1157" font-size="14" class="b hi" text-anchor="end">+13</text>
  <text x="1336" y="1157" font-size="14" class="b hi" text-anchor="end">91</text>

  <!-- 5 -->
  <line x1="104" y1="1180" x2="1336" y2="1180" stroke="#232A34"/>
  <circle cx="116" cy="1208" r="11" fill="none" stroke="#E5534B" stroke-width="1.5"/>
  <text x="116" y="1212" font-size="11" class="b" text-anchor="middle">5</text>
  <text x="140" y="1213" font-size="12" class="m q">+64 min</text>
  <text x="240" y="1213" font-size="14">Sell fee lowered 99% → 25%. The owner can still raise it again at any time.</text>
  <rect x="1050" y="1196" width="68" height="22" rx="11" fill="#262D38"/>
  <text x="1084" y="1211" font-size="11" class="s" text-anchor="middle">Storage</text>
  <text x="1240" y="1213" font-size="14" class="b lo" text-anchor="end">−7</text>
  <text x="1336" y="1213" font-size="14" class="b hi" text-anchor="end">84</text>
  <line x1="104" y1="1236" x2="1336" y2="1236" stroke="#232A34"/>

  <text x="80" y="1288" font-size="12" class="q">Sketch note: hover a marker in the graph to highlight the same row in the log and vice versa. Blue tag = bytecode, grey = owner settings and pool events (extra evidence beyond the bytecode).</text>
</svg>
