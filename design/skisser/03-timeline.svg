  <!-- per ruta: y = 808 − v·0.9, x = x0 + 20 + t·3.1 -->
  <rect x="80" y="676" width="412" height="166" rx="16" class="card"/>
  <text x="100" y="706" font-size="14" class="b">Rug pull</text>
  <text x="472" y="706" font-size="14" class="b hi" text-anchor="end">35% → 62%</text>
  <line x1="100" y1="754" x2="472" y2="754" stroke="#E5534B" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="100" y1="781" x2="472" y2="781" stroke="#E5A13A" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="100" y1="808" x2="472" y2="808" stroke="#262D38"/>
  <path d="M100 776.5 H134 V755.8 H181 V754 H298 V752.2 H472" fill="none" stroke="#E5534B" stroke-width="2"/>
  <text x="100" y="830" font-size="12" class="q">Driven by upgrade power and mint</text>

  <rect x="514" y="676" width="412" height="166" rx="16" class="card"/>
  <text x="534" y="706" font-size="14" class="b">Honeypot</text>
  <text x="906" y="706" font-size="14" class="b hi" text-anchor="end">18% → 91%</text>
  <line x1="534" y1="754" x2="906" y2="754" stroke="#E5534B" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="534" y1="781" x2="906" y2="781" stroke="#E5A13A" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="534" y1="808" x2="906" y2="808" stroke="#262D38"/>
