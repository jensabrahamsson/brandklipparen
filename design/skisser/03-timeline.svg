  <text x="534" y="830" font-size="12" class="q">Jumped when blacklist appeared in new logic</text>

  <rect x="948" y="676" width="412" height="166" rx="16" class="card"/>
  <text x="968" y="706" font-size="14" class="b">Bot-pump</text>
  <text x="1340" y="706" font-size="14" class="b mid" text-anchor="end">40% → 34%</text>
  <line x1="968" y1="754" x2="1340" y2="754" stroke="#E5534B" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="968" y1="781" x2="1340" y2="781" stroke="#E5A13A" stroke-opacity="0.25" stroke-dasharray="3 4"/>
  <line x1="968" y1="808" x2="1340" y2="808" stroke="#262D38"/>
  <path d="M968 772 H977 V770.2 H1002 V775.6 H1049 V777.4 H1340" fill="none" stroke="#E5A13A" stroke-width="2"/>
  <text x="968" y="830" font-size="12" class="q">Stable: launch limits offset by sniper guard</text>

  <!-- ========== EVENT LOG ========== -->
  <rect x="80" y="862" width="1280" height="398" rx="16" class="card"/>
  <text x="104" y="898" font-size="17" class="b">What changed</text>
  <text x="1050" y="898" class="th">SOURCE</text>
  <text x="1240" y="898" class="th" text-anchor="end">CHANGE</text>
  <text x="1336" y="898" class="th" text-anchor="end">SCORE</text>

  <!-- 1 -->
  <line x1="104" y1="916" x2="1336" y2="916" stroke="#232A34"/>
  <circle cx="116" cy="944" r="11" fill="none" stroke="#E5A13A" stroke-width="1.5"/>
  <text x="116" y="948" font-size="11" class="b" text-anchor="middle">1</text>
  <text x="140" y="949" font-size="12" class="m q">+0 min</text>
  <text x="240" y="949" font-size="14">Contract deployed. Owner can mint, upgrade the logic and set trading limits.</text>
  <rect x="1050" y="932" width="74" height="22" rx="11" fill="#1E2A3A"/>
  <text x="1087" y="947" font-size="11" class="br" text-anchor="middle">Bytecode</text>
  <text x="1240" y="949" font-size="14" class="q" text-anchor="end">—</text>
  <text x="1336" y="949" font-size="14" class="b mid" text-anchor="end">41</text>

  <!-- 2 -->
  <line x1="104" y1="972" x2="1336" y2="972" stroke="#232A34"/>
  <circle cx="116" cy="1000" r="11" fill="none" stroke="#E5A13A" stroke-width="1.5"/>
  <text x="116" y="1004" font-size="11" class="b" text-anchor="middle">2</text>
  <text x="140" y="1005" font-size="12" class="m q">+3 min</text>
