<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1300" width="1440" height="1300">
  <title>Brandklipparen – skiss 3: tidslinje</title>
  <style>
    text { font-family: Inter, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; fill: #E6EAF0; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
    .s { fill: #8B95A3; }
    .q { fill: #5E6876; }
    .b { font-weight: 600; }
    .lo { fill: #3FB97F; } .mid { fill: #E5A13A; } .hi { fill: #E5534B; } .br { fill: #7E9CC2; }
    .th { font-size: 12px; fill: #5E6876; font-weight: 600; letter-spacing: 0.8px; }
    .card { fill: #161B22; stroke: #262D38; }
    .ax { font-size: 12px; fill: #5E6876; }
  </style>
  <defs>
    <symbol id="vakt" viewBox="0 0 100 100">
      <path d="M40 30 L48 8 L56 25 L64 27 L58 66 L66 96 L24 96 Q26 56 40 30 Z" fill="#4E6A8F"/>
      <path d="M56 25 L64 27 L90 55 L92 65 L84 71 L70 65 L58 66 L52 44 Z" fill="#7E9CC2"/>
      <path d="M62 37 L68 40 L62 43 Z" fill="#D4B36A"/>
