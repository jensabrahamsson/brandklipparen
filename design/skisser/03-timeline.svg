  <text x="104" y="264" font-size="17" class="b">Risk score since deploy</text>
  <text x="104" y="286" font-size="13" class="q">Bytecode is re-analyzed on every upgrade; owner settings are re-read every block.</text>

  <rect x="1182" y="246" width="50" height="28" rx="14" fill="none" stroke="#262D38"/>
  <text x="1207" y="265" font-size="12" class="s" text-anchor="middle">15 m</text>
  <rect x="1238" y="246" width="44" height="28" rx="14" fill="none" stroke="#262D38"/>
  <text x="1260" y="265" font-size="12" class="s" text-anchor="middle">1 h</text>
  <rect x="1288" y="246" width="48" height="28" rx="14" fill="#2A3A52"/>
  <text x="1312" y="265" font-size="12" class="b" text-anchor="middle">All</text>

