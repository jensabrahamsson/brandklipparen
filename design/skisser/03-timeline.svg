  <text x="150" y="624" class="ax" text-anchor="middle">deploy</text>
  <text x="296" y="624" class="ax" text-anchor="middle">15 m</text>
  <text x="443" y="624" class="ax" text-anchor="middle">30 m</text>
  <text x="589" y="624" class="ax" text-anchor="middle">45 m</text>
  <text x="735" y="624" class="ax" text-anchor="middle">1 h</text>
  <text x="881" y="624" class="ax" text-anchor="middle">1 h 15</text>
  <text x="1028" y="624" class="ax" text-anchor="middle">1 h 30</text>
  <text x="1174" y="624" class="ax" text-anchor="middle">1 h 45</text>
  <text x="1320" y="624" class="ax b" text-anchor="middle" style="fill:#8B95A3">now</text>

  <!-- yta + steglinje: 41 → 44 → 78 → 91 → 84 -->
  <path d="M150 477 H179 V468 H257 V366 H404 V327 H774 V348 H1320 V600 H150 Z" fill="url(#area)"/>
  <path d="M150 477 H179 V468 H257 V366 H404 V327 H774 V348 H1320" fill="none" stroke="#E5534B" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="1320" y1="300" x2="1320" y2="600" stroke="#8B95A3" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  <circle cx="1320" cy="348" r="5" fill="#E5534B"/>
  <circle cx="1320" cy="348" r="10" fill="#E5534B" fill-opacity="0.2"/>

  <!-- event marker -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <circle cx="150" cy="477" r="10" fill="#161B22" stroke="#E5A13A" stroke-width="1.5"/><text x="150" y="481">1</text>
    <circle cx="179" cy="468" r="10" fill="#161B22" stroke="#E5A13A" stroke-width="1.5"/><text x="179" y="472">2</text>
    <circle cx="257" cy="366" r="10" fill="#161B22" stroke="#E5534B" stroke-width="1.5"/><text x="257" y="370">3</text>
    <circle cx="404" cy="327" r="10" fill="#161B22" stroke="#E5534B" stroke-width="1.5"/><text x="404" y="331">4</text>
    <circle cx="774" cy="348" r="10" fill="#161B22" stroke="#E5534B" stroke-width="1.5"/><text x="774" y="352">5</text>
  </g>
  <!-- callouts -->
  <text x="276" y="396" font-size="13" class="b hi">+34</text>
  <text x="308" y="396" font-size="13" class="s">Proxy upgraded: blacklist and fee setter added</text>
  <text x="790" y="378" font-size="13" class="b lo">−7</text>
  <text x="814" y="378" font-size="13" class="s">Sell fee lowered, but can still be raised</text>

