    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5534B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E5534B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1300" fill="#0E1116"/>

  <!-- NAV -->
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#1E242D"/>
  <use href="#vakt" x="32" y="14" width="34" height="34"/>
  <text x="74" y="39" font-size="18" class="b">brandklipparen</text>
  <rect x="290" y="16" width="420" height="32" rx="8" fill="#161B22" stroke="#262D38"/>
