  <rect x="105" y="936" width="3" height="22" fill="#E5534B"/>
  <text x="120" y="928" class="ln">212</text><text x="160" y="928" class="code">function transfer(address to, uint256 amount) external returns (bool) {</text>
  <text x="120" y="952" class="ln">213</text><text x="160" y="952" class="code">    require(!_blocked[msg.sender]);   <tspan class="cm">// only the owner writes _blocked</tspan></text>
  <text x="120" y="976" class="ln">214</text><text x="160" y="976" class="code">    uint256 fee = to == _pair ? _sellFee : _buyFee;</text>
  <text x="120" y="1000" class="ln">215</text><text x="160" y="1000" class="code">    _balances[to] += amount - amount * fee / 100;</text>
  <text x="120" y="1018" class="ln">216</text><text x="160" y="1018" class="code">}</text>

