name: ci

on:
  push:
  pull_request:

# A new push to a branch cancels the older gate run on that branch (I-01).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
      # I-05: enforce the Node 22 LTS runtime (A-29) on the runner itself.
      - run: node -p process.versions.node | grep -q '^22\.'
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Vendor-name guard: no non-Meta AI vendor or tool name in tracked
      # files (also runs inside `npm run check`).
      - run: npm run check:vendors
      # English-only guard: no Swedish letters in tracked text files
      # (also runs inside `npm run check`).
      - run: npm run check:english
      # S-053 deterministic plugin audit gate (K-516, P-13): every
      # registered and example plugin passes the static checks, or the
      # gate turns red before any advisory AI review.
      - run: npm run audit:plugins
